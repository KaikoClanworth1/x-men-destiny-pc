# X-Men: Destiny - codegen overrides for Default.xex
# (included from xmd_manifest.toml)

# The CRT's setjmp / longjmp (buffer in r3). Lua's error handling (lua_pcall)
# uses them: recompiled as plain code, longjmp returned to its caller instead
# of unwinding, and every caught script error ended in exit() - the first one
# as START is pressed on the title screen (the Flash menu's
# MainMenuIntroActivated has no script handler, by design). The codegen
# replaces calls to them.
setjmp_address = 0x829561F0
longjmp_address = 0x82950120

